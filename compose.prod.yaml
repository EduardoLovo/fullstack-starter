# Ambiente de produção.
#
#   cp .env.prod.example .env.prod        # e troque os segredos
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#   docker compose -f compose.prod.yaml --env-file .env.prod run --rm migrate npx prisma db seed
#
# Diferenças em relação ao compose.yaml (dev):
# - imagens "prod" dos Dockerfiles (sem devDependencies, sem hot reload, sem root)
# - só o Nginx tem porta publicada; banco, Redis, API e web ficam só na rede interna
# - migrations num serviço próprio, que roda e termina antes da API subir
# - containers endurecidos: sistema de arquivos só leitura, sem capabilities,
#   limites de memória/CPU e rotação de logs
# - variáveis obrigatórias: se faltar alguma, o compose nem sobe (${VAR:?mensagem})

name: fullstack-starter-prod

# Blocos reutilizados pelos serviços (âncoras YAML).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m" # sem isso, o log de um container cresce até encher o disco
    max-file: "3"

x-hardening: &hardening
  read_only: true # um invasor não consegue gravar/alterar arquivos da aplicação
  cap_drop: [ALL] # nenhum privilégio extra do kernel (as portas são > 1024)
  security_opt:
    - no-new-privileges:true # impede escalar privilégio via binários setuid
  tmpfs:
    - /tmp # única pasta gravável, em memória

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env.prod}@redis:6379

services:
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging: *logging
    networks: [frontend, backend]

  web:
    build:
      context: ./apps/web
      target: prod
    restart: unless-stopped
    <<: *hardening
    tmpfs:
      - /tmp
      - /app/.next/cache # cache de runtime do Next (otimização de imagens etc.)
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    logging: *logging
    networks: [backend]

  migrate:
    # Roda "prisma migrate deploy" e termina. A API espera ele terminar com sucesso.
    build:
      context: ./apps/api
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [backend]

  api:
    build:
      context: ./apps/api
      target: prod
    image: fullstack-starter-api:prod # o worker reaproveita esta mesma imagem
    restart: unless-stopped
    <<: *hardening
    environment:
      <<: *api-env
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env.prod}
      APP_URL: ${APP_URL:?defina APP_URL no .env.prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOSTS: nginx
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    logging: *logging
    networks: [backend]

  worker:
    # Mesma imagem da API (mesmo build e mesmo nome): o compose constrói uma vez só.
    build:
      context: ./apps/api
      target: prod
    image: fullstack-starter-api:prod
    command: ["node", "dist/worker/index.js"]
    restart: unless-stopped
    <<: *hardening
    init: true
    stop_grace_period: 30s
    environment:
      <<: *api-env
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no .env.prod}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no .env.prod}
    # A imagem traz um healthcheck HTTP (da API); o worker não tem porta, então
    # usa o "batimento" gravado em /tmp a cada 10s.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/tmp/worker-heartbeat').mtimeMs<30000?0:1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging
    # "egress": o worker precisa sair para a internet para falar com o SMTP.
    networks: [backend, egress]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    logging: *logging
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    # noeviction: com a memória cheia, o Redis recusa escritas em vez de apagar
    # chaves. É o recomendado pelo BullMQ: apagar chaves da fila perderia e-mails.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging
    networks: [backend]

  # Só para testar e-mails localmente:  --profile local  (e SMTP_HOST=mailpit)
  mailpit:
    image: axllent/mailpit:latest
    profiles: [local]
    ports:
      - "127.0.0.1:8026:8025"
    # Porta publicada exige uma rede não interna (frontend).
    networks: [backend, frontend]

volumes:
  postgres_data:
  redis_data:

networks:
  # frontend: onde o Nginx recebe as conexões de fora.
  # backend:  rede interna (sem acesso à internet) entre todos os serviços.
  #           Banco, Redis, API e web não falam com o mundo, nem são alcançados por ele.
  # egress:   saída para a internet, só para o worker (SMTP).
  frontend:
  backend:
    internal: true
  egress:
