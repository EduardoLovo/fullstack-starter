# Porta única de entrada da aplicação:
#
#   http://localhost:8080/        -> web (Next.js)
#   http://localhost:8080/api/... -> api (Fastify), sem o prefixo /api
#
# O navegador vê tudo como um site só (mesma origem): sem CORS, e o cookie de
# sessão vale para o frontend e para a API.

# DNS interno do Docker. Junto com o "resolve" nos upstreams abaixo, faz o Nginx
# reconsultar o IP dos containers: sem isso, ele resolve "api" uma vez só ao
# subir e, se a API for recriada com outro IP, passa a responder 502.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:3333 resolve;
    keepalive 16; # reaproveita conexões com a API em vez de abrir uma por requisição
}

upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 16;
}

# Para o hot reload do Next (WebSocket): só envia "Connection: upgrade"
# quando o navegador pediu upgrade; nas demais, mantém a conexão keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

log_format main_timed '$remote_addr "$request" $status $body_bytes_sent '
                      'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main_timed;

    # Não anuncia a versão do Nginx nas respostas e páginas de erro.
    server_tokens off;

    # Limite de upload (ex.: avatar). Acima disso: 413 sem nem chegar à API.
    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança para todas as respostas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Usado pelo healthcheck do container.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # As métricas da API revelam rotas, volumes e erros: só o Prometheus lê,
    # direto pela rede interna (api:3333/metrics). De fora, finge que não existe.
    location = /api/metrics {
        return 404;
    }

    location /api/ {
        # A barra no final do proxy_pass remove o prefixo: /api/auth/login -> /auth/login
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # SOBRESCREVE (em vez de acrescentar) o X-Forwarded-For com o IP real.
        # Se acrescentasse, um cliente poderia mandar um X-Forwarded-For falso e
        # burlar o rate limit da API fingindo ser outro IP a cada requisição.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# Porta interna (nunca publicada no host) só com os contadores do próprio Nginx
# (conexões ativas, requisições...), lidos pelo nginx-prometheus-exporter.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
