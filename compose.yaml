# Ambiente de desenvolvimento.
#
# Entrada única (Nginx): http://localhost:8080   (frontend em /, API em /api)
# Acesso direto, para depurar: frontend :3000, API :3333/docs
#
# Subir tudo com hot reload:   docker compose up --watch

name: fullstack-starter

services:
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      # Para aplicar mudanças no arquivo sem derrubar o container:
      #   docker compose exec nginx nginx -s reload
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  web:
    build:
      context: ./apps/web
      target: dev
    init: true
    restart: unless-stopped
    environment:
      # O navegador chama /api/* no próprio frontend, e o Next repassa
      # para a API pelo nome do serviço na rede do Docker.
      API_INTERNAL_URL: http://api:3333
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 60s # a primeira compilação do next dev demora
      retries: 3
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/src
        - action: rebuild
          path: ./apps/web/package.json
        - action: sync+restart
          path: ./apps/web/next.config.ts
          target: /app/next.config.ts
    networks:
      - backend

  api:
    build:
      context: ./apps/api
      target: dev # estágio "dev" do Dockerfile multi-stage
    # init: true coloca um mini "init" (tini) como PID 1, que repassa sinais
    # e recolhe processos órfãos. Sem ele, o Node como PID 1 ignora o Ctrl+C.
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3333
      # Dentro da rede do Docker, cada serviço é encontrado pelo nome:
      # "postgres" e "redis" viram endereços (DNS interno do Docker).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:3000
      # Só o Nginx pode informar o IP real do cliente (X-Forwarded-For), porque ele
      # SOBRESCREVE o cabeçalho. O proxy do Next (web) repassa o valor que o cliente
      # mandou, então confiar nele permitiria burlar o rate limit pela porta 3000.
      TRUSTED_PROXY_HOSTS: nginx
      # Link do e-mail de redefinição de senha: aponta para a entrada pelo Nginx.
      APP_URL: ${APP_URL:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      # Só sobe a API quando banco e Redis responderem ao healthcheck.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    develop:
      # Compose Watch: copia as alterações para dentro do container.
      # No Windows é mais confiável que bind mount, que não avisa o container
      # quando um arquivo muda (e o hot reload não dispara).
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
          ignore:
            - generated/
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/prisma
    networks:
      - backend

  worker:
    # Mesma imagem da API, outro comando: o código da fila é compartilhado,
    # mas o processo roda separado e pode escalar sozinho:
    #   docker compose up -d --scale worker=3
    build:
      context: ./apps/api
      target: dev
    # Chama o tsx direto (sem npm no meio) para o SIGTERM chegar ao worker.
    command: ["./node_modules/.bin/tsx", "watch", "src/worker/index.ts"]
    init: true
    stop_grace_period: 30s # tempo para terminar os e-mails em andamento
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Fullstack Starter <no-reply@starter.dev>
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # O worker não tem porta HTTP: ele grava um "batimento" num arquivo a cada
      # 10s, e o container é saudável enquanto o arquivo tiver menos de 30s.
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/tmp/worker-heartbeat').mtimeMs<30000?0:1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/src
          target: /app/src
          ignore:
            - generated/
        - action: rebuild
          path: ./apps/api/package.json
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 127.0.0.1 = só acessível da sua máquina, não da rede
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: persiste em disco, para a fila de e-mails não se perder num restart
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend

  mailpit:
    # Captura todo e-mail enviado em dev. Interface web em http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # interface web
      - "127.0.0.1:1025:1025" # SMTP
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
