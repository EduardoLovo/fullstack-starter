# Ambiente de desenvolvimento.
# Os serviços worker, web e nginx entram nas próximas etapas.
#
# Subir tudo com hot reload:   docker compose up --watch

name: fullstack-starter

services:
  api:
    build:
      context: ./apps/api
      target: dev # estágio "dev" do Dockerfile multi-stage
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3333
      # Dentro da rede do Docker, cada serviço é encontrado pelo nome:
      # "postgres" e "redis" viram endereços (DNS interno do Docker).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      # Só sobe a API quando banco e Redis responderem ao healthcheck.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    develop:
      # Compose Watch: copia as alterações para dentro do container.
      # No Windows é mais confiável que bind mount, que não avisa o container
      # quando um arquivo muda (e o hot reload não dispara).
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
          ignore:
            - generated/
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/prisma
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 127.0.0.1 = só acessível da sua máquina, não da rede
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: persiste em disco, para a fila de e-mails não se perder num restart
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend

  mailpit:
    # Captura todo e-mail enviado em dev. Interface web em http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # interface web
      - "127.0.0.1:1025:1025" # SMTP
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
